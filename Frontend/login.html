<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — JetLease India</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="nav" id="siteNav"></header>

<div class="auth-wrap">
  <div class="auth-card card fade-in">
    <div class="eyebrow">Welcome back</div>
    <h2>Log in to JetLease</h2>

    <div class="search-tabs" id="loginTabs" style="margin-bottom:20px;">
      <button class="search-tab active" data-mode="email">Email</button>
      <button class="search-tab" data-mode="phone">Phone</button>
      <button class="search-tab" data-mode="otp">OTP</button>
    </div>

    <form id="loginForm">
      <div id="emailLoginFields">
        <div class="field" style="margin-bottom:14px;"><label>Email</label><input type="email" id="loginEmail" placeholder="you@company.com"></div>
        <div class="field"><label>Password</label>
          <div class="otp-row">
            <input type="password" id="loginPassword" placeholder="Password">
            <button type="button" class="btn btn-ghost btn-sm" onclick="togglePasswordVisibility('loginPassword', this)">Show</button>
          </div>
        </div>
      </div>
      <div id="phoneLoginFields" style="display:none;">
        <div class="field" style="margin-bottom:14px;"><label>Phone</label><input type="tel" id="loginPhone" pattern="[0-9]{10}" placeholder="10-digit mobile"></div>
        <div class="field"><label>Password</label>
          <div class="otp-row">
            <input type="password" id="loginPhonePassword">
            <button type="button" class="btn btn-ghost btn-sm" onclick="togglePasswordVisibility('loginPhonePassword', this)">Show</button>
          </div>
        </div>
      </div>
      <div id="otpLoginFields" style="display:none;">
        <div class="field" style="margin-bottom:14px;">
          <label>Email or Phone</label>
          <div class="otp-row"><input type="text" id="otpIdentifier" placeholder="you@company.com"><button type="button" class="btn btn-ghost btn-sm" id="sendLoginOtp">Send OTP</button></div>
        </div>
        <div class="field"><label>OTP Code</label><input type="text" id="loginOtp" maxlength="6" placeholder="123456"></div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0;font-size:13px;">
        <label style="display:flex;gap:8px;align-items:center;color:var(--text-dim);"><input type="checkbox" id="rememberMe"> Remember me</label>
        <a href="#" onclick="document.getElementById('forgotModal').style.display='flex';return false;" style="color:var(--accent);">Forgot password?</a>
      </div>

      <button class="btn btn-primary btn-block" type="submit">Log In</button>
    </form>

    <p style="margin-top:18px;text-align:center;font-size:14px;">New to JetLease? <a href="register.html" style="color:var(--accent);">Create an account</a></p>
    <p style="margin-top:6px;text-align:center;font-size:12px;color:var(--text-dim);">Demo login: demo@jetlease.in / Demo@123</p>
    <p style="margin-top:10px;text-align:center;font-size:13px;"><a href="admin-login.html" style="color:var(--text-dim);">Admin Portal →</a></p>
  </div>
</div>

<div id="forgotModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:200;">
  <div class="card" style="max-width:380px;width:90%;">
    <h3>Reset your password</h3>
    <p>Enter your account email and we'll send a mock reset link.</p>
    <div class="field" style="margin-bottom:14px;"><label>Email</label><input type="email" id="forgotEmail"></div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-ghost btn-block" onclick="document.getElementById('forgotModal').style.display='none'">Cancel</button>
      <button class="btn btn-primary btn-block" onclick="requestPasswordReset()">Send Link</button>
    </div>
  </div>
</div>

<footer class="site-footer" id="siteFooter"></footer>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
