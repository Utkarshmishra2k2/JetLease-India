<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — JetLease India</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="nav" id="siteNav"></header>

<div class="dash-topbar" id="dashTopbar">
  <div class="container dash-topbar-inner">
    <div class="dash-topbar-heading">
      <h2 id="dashGreeting" style="margin:0;">Welcome back</h2>
      <p class="dash-topbar-sub">Manage your bookings, payments, and lease agreements.</p>
    </div>
    <div style="position:relative;">
      <button class="dash-profile-btn" id="profileBtn" onclick="toggleProfileMenu()" aria-label="Account menu">
        <img src="assets/images/placeholder-icon.svg" alt="">
      </button>
      <div id="profileMenu" class="card profile-menu" style="display:none;">
        <p id="profileMenuEmail" class="pm-email"></p>
        <button class="btn btn-primary btn-block btn-sm" onclick="logout()">Log Out</button>
      </div>
    </div>
  </div>
</div>

<div class="container" style="padding-top:24px;padding-bottom:60px;">
  <div class="pill-nav" id="dashTabs">
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="profile">Profile</button>
    <button data-tab="bookings">Bookings</button>
    <button data-tab="payments">Payments</button>
    <button data-tab="notifications">Notifications</button>
    <button data-tab="leases">Lease Agreements</button>
    <button data-tab="reports">Report an Issue</button>
  </div>
  <div class="kpi-grid" id="kpiGrid"></div>
  <div id="dashPanels"></div>
</div>

<div id="dashModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:200;padding:20px;">
  <div class="card" style="max-width:480px;width:100%;max-height:86vh;overflow-y:auto;" id="dashModalBody"></div>
</div>

<footer class="site-footer" id="siteFooter"></footer>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
