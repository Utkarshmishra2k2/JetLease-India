<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal — JetLease India</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="nav" id="siteNav"></header>

<div class="auth-wrap">
  <div class="auth-card card fade-in">
    <div class="eyebrow">Restricted access</div>
    <h2>Operations &amp; Admin Portal</h2>
    <p>This console is for JetLease operations staff only. There is no public registration — accounts are provisioned internally.</p>

    <form id="adminLoginForm">
      <div class="field" style="margin-bottom:14px;"><label>Admin Email</label><input type="email" id="adminEmail" value="admin@jetlease.in" required></div>
      <div class="field" style="margin-bottom:18px;"><label>Password</label>
        <div class="otp-row">
          <input type="password" id="adminPassword" value="Admin@123" required>
          <button type="button" class="btn btn-ghost btn-sm" onclick="togglePasswordVisibility('adminPassword', this)">Show</button>
        </div>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Enter Admin Console</button>
    </form>
    <p style="margin-top:16px;text-align:center;font-size:12px;color:var(--text-dim);">Demo admin login: admin@jetlease.in / Admin@123</p>
    <p style="margin-top:10px;text-align:center;font-size:13px;"><a href="login.html" style="color:var(--text-dim);">← Back to customer login</a></p>
  </div>
</div>

<footer class="site-footer" id="siteFooter"></footer>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
